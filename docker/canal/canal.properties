#################################################
# Canal Server 1.1.8 —— docker-compose 演示配置
# 挂载到容器内 /home/admin/canal-server/conf/canal.properties
#################################################

canal.id=1
canal.ip=
canal.port=11111
canal.metrics.pull.port=11112
canal.zkServers=
canal.serverMode=kafka

# 需要关注的 destination 列表
canal.destinations=example

# 自动扫描 instance 配置
canal.auto.scan=true
canal.auto.scan.interval=5

# -------------------------------------------------
# Kafka 输出
# -------------------------------------------------
# 容器网络内使用服务名 kafka:9092
canal.mq.servers=kafka:9092
canal.mq.retries=0
canal.mq.batchSize=16384
canal.mq.maxRequestSize=1048576
canal.mq.lingerMs=1
canal.mq.bufferMemory=67108864
# 低流量时按一条事件及时取出；5000 ms 是空闲等待上限。
canal.mq.canalBatchSize=1
canal.mq.canalGetTimeout=5000

# false = Message/Entry 模式，保留真实 binlog 文件名和位点。
# 必须与应用侧 canal.mq.kafka.flat-message 一致。
canal.mq.flatMessage=false

canal.mq.compressionType=none
canal.mq.acks=all
canal.mq.transaction=false

canal.mq.topic=example

# 分区数必须 >= 应用侧 canal.mq.kafka.partition-count
canal.mq.partitionsNum=6

# 同一业务主键进入同一分区：$pk$ 自动取表主键。
# properties 中 \\ 转义为一个反斜杠，最终正则为 demo_db\..*
canal.mq.partitionHash=demo_db\\..*:$pk$

# -------------------------------------------------
# instance 内存缓冲
# -------------------------------------------------
canal.instance.memory.buffer.size=16384
canal.instance.memory.buffer.memunit=1024
canal.instance.memory.batch.mode=ITEMSIZE
canal.instance.parser.parallel=true

# TSDB（本地演示关闭，避免额外依赖）
canal.instance.tsdb.enable=false

canal.instance.stat.task.class=com.alibaba.otter.canal.server.stat.DefaultInstanceStats
canal.mq.enableDynamicTopic=false
